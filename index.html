<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boca Fútbol</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        header {
            background: #0b3d91;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        nav {
            background: #06265c;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        main {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        .tarjeta {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .tarjeta h2 {
            color: #0b3d91;
        }
    </style>
</head>

<body>

    <header>
        <h1>Boca Fútbol</h1>
        <p>Todo sobre Boca y sus jugadores</p>
    </header>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Partidos</a>
        <a href="#">Jugadores</a>
        <a href="#">Préstamos</a>
    </nav>

    <main>

        <div class="tarjeta">
            <h2>Próximo partido</h2>
            <p>Boca Juniors vs. Próximo rival</p>
            <p>Fecha y hora próximamente</p>
        </div>

        <div class="tarjeta">
            <h2>Últimos resultados</h2>
            <p>Todavía no hay resultados cargados.</p>
        </div>

        <div class="tarjeta">
            <h2>Jugadores de Boca</h2>
            <p>Plantel actual, jugadores cedidos y exjugadores.</p>
        </div>

    </main>

</body>
</html>
